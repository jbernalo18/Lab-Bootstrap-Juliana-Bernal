<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!---CDN boostrap link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>HTML Example</title>
</head>
 <div class="container"> <!---inciio contenedor principal-->  
    <div style="grid-template-columns: 1fr 1fr 1fr;" class="d-grid gap-3 justify-items-center"> <!--incio contenedor grid para botones-->
    <button type="button" class="btn btn-danger">Danger</button> <!--boton-->
    <button type="button" class="btn btn-warning">Warning</button> <!--boton-->
    <button type="button" class="btn btn-success">Success</button> <!--boton-->
        <p class="text-start">Izquierda</p> <!---texto izquierda-->
        <p class="text-center text-danger">Centro</p> <!---texto centro rojo-->
        <p class="text-end">Derecha</p> <!---texto derecha-->
    </div> <!---cierre contenedor grid para botones-->

 <div class="d-flex justify-content-center"> <!---inicio contenedor para centrar la tarjeta-->
    <div class="card" style="width: 18rem;"> <!---inicio contenedor tarjeta con lista de bootstrap-->
        <img src="./ilustracion-inicio.svg" class="card-img-top" alt="...">
        <div class="card-body">
            <h5 class="card-title text-center">Mi Perfil</h5>
        </div>
        <ul class="list-group list-group-flush text-center">
            <li class="list-group-item">Juliana Bernal</li>
            <li class="list-group-item">Bello</li>
            <li class="list-group-item">El ajedrez</li>
        </ul>
 </div> <!---cierre contenedor tarjeta con listas de bootstrap-->
</div> <!---cierre contenedor para centrar tarjetas-->
 <body>
</div> <!--cierre contenedor principal-->
 <!---CDN bootstrap script-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
